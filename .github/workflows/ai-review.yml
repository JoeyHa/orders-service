name: AI Review

# Review pipeline L4 (risk) + L5 (AI review). See docs/review-pipeline.md.
# pull_request_target: this file, the reviewer code and REVIEW.md/CLAUDE.md come from main.
# The PR is checked out to ./pr as data: nothing from it is installed or executed, and the
# agents read it with Read/Grep/Glob confined to that directory.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # post the review
  issues: write # set risk labels

jobs:
  ai-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    environment: ai-review # holds the token; only jobs running from main may use it
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4 # main: reviewer code + policy

      - uses: actions/checkout@v4 # the PR, as data
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0 # incremental rounds diff against earlier PR commits
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install reviewer (from main's pins, never the PR's)
        run: pip install ".[review]"

      - name: Review
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_DIR: pr
        run: python -m review

  approvals:
    # ai-review sets the risk labels with GITHUB_TOKEN, which never triggers approvals.yml;
    # re-check here so the required "approvals" check reflects the new label
    needs: ai-review
    if: always() && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # main: policy + script
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check approvals
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 -m review.approvals
